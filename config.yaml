# ==========================================================
# AI Hub 模型配置
# ----------------------------------------------------------
# 每个 provider 一个条目。api_key 支持 ${ENV_VAR} 形式从环境
# 变量 / .env 读取，也可以直接写明文（不建议提交到 git）。
#
# kind 可选值:
#   openai   - 任何 OpenAI 兼容接口 (OpenAI/DeepSeek/Kimi/硅基流动/Ollama/vLLM...)
#   gemini   - Google Gemini (含 Imagen 出图、Veo 出视频)
#   dashscope- 阿里百炼/通义 (千问 + 万相图片/视频)
#   ark      - 火山方舟 豆包 / 即梦 (Doubao + Seedream/Seedance)
#   zhipu    - 智谱 GLM (CogView 图片 / CogVideoX 视频)
#   modelscope - 魔搭社区 ModelScope API-Inference (对话 + 异步出图)
#
# models 下按能力分组: chat / image / video
# 留空的分组表示该 provider 不提供该能力。
#
# 模型可加的标记:
#   vision: true       对话模型能看图
#   image_input: true  出图/视频模型支持传参考图（图生图 / 图生视频）
#   sizes: [...]       该出图模型支持/推荐的尺寸，界面「尺寸」下拉只列这些；
#                      不写则用通用列表。写第一个为默认值。
#   max_images: 4      参考图最多传几张（多参考图/组图）。界面会按这个数拦住
#                      多选，服务端也会兜底裁剪。不写 = 不限制/未知。
#
# provider 级可选:
#   image_edit_mode: json   OpenAI 兼容接口的图生图改走 /images/generations
#                           的 image 字段（默认走 /images/edits 上传文件）
#   ref_mode: base64|url    参考图怎么送给服务商：base64 直传，或先传腾讯云 COS
#                           换成公网预签名 URL。不写 = 自动：本来就吃 base64 的
#                           直传；只认 URL 的（魔搭/百炼/智谱）走 COS，而 COS 关掉
#                           时魔搭会自动降级成 base64（实测可行）
# ==========================================================

providers:
  - id: openai
    name: OpenAI
    kind: openai
    base_url: https://api.openai.com/v1
    api_key: ${OPENAI_API_KEY}
    models:
      chat:
        - id: gpt-4o
          name: GPT-4o
          vision: true
        - id: gpt-4o-mini
          name: GPT-4o mini
          vision: true
      image:
        - id: gpt-image-1
          name: GPT Image 1
          image_input: true      # 支持传参考图做编辑（走 /images/edits）
          sizes: [1024x1024, 1536x1024, 1024x1536]
        - id: dall-e-3
          name: DALL·E 3
          sizes: [1024x1024, 1792x1024, 1024x1792]
      video: []

  - id: deepseek
    name: DeepSeek
    kind: openai
    base_url: https://api.deepseek.com/v1
    api_key: ${DEEPSEEK_API_KEY}
    models:
      chat:
        - id: deepseek-chat
          name: DeepSeek V3
        - id: deepseek-reasoner
          name: DeepSeek R1 (推理)
          reasoning: true
      image: []
      video: []

  - id: siliconflow
    name: 硅基流动
    kind: openai
    base_url: https://api.siliconflow.cn/v1
    api_key: ${SILICONFLOW_API_KEY}
    models:
      chat:
        - id: Qwen/Qwen3-8B
          name: Qwen3-8B
        - id: deepseek-ai/DeepSeek-V3
          name: DeepSeek-V3
      image:
        - id: Kwai-Kolors/Kolors
          name: Kolors 出图
          sizes: [1024x1024, 1024x576, 576x1024, 768x1024, 1024x768, 960x1280, 720x1440, 720x1280]
      video: []

  - id: ollama
    name: Ollama (本地)
    kind: openai
    base_url: http://localhost:11434/v1
    api_key: ollama
    models:
      chat:
        - id: qwen3:8b
          name: Qwen3 8B
        - id: llama3.2-vision
          name: Llama3.2 Vision
          vision: true
      image: []
      video: []

  - id: modelscope
    name: 魔搭社区 ModelScope
    kind: modelscope
    base_url: https://api-inference.modelscope.cn/v1
    api_key: ${MODELSCOPE_API_KEY}
    async_image: true          # 出图走异步任务模式，false 则同步（易超时）
    ref_mode: base64
    models:
      chat:
        - id: Qwen/Qwen3-235B-A22B-Instruct-2507
          name: Qwen3-235B-A22B
        - id: deepseek-ai/DeepSeek-V4-Pro
          name: DeepSeek-V4-Pro
        - id: ZhipuAI/GLM-4.5
          name: GLM-4.5
        - id: Qwen/Qwen2.5-VL-72B-Instruct
          name: Qwen2.5-VL-72B (视觉)
          vision: true
      image:
        - id: Qwen/Qwen-Image-2512
          name: Qwen-Image 文生图
          sizes: [1328x1328, 1664x928, 928x1664, 1472x1104, 1104x1472, 1584x1056, 1056x1584]
        - id: Qwen/Qwen-Image-Edit-2511
          name: Qwen-Image 图生图
          image_input: true
          max_images: 4          # 实测魔搭 image_url 最多 4 张
          sizes: [1328x1328, 1664x928, 928x1664, 1472x1104, 1104x1472, 1584x1056, 1056x1584]
        - id: black-forest-labs/FLUX.2-klein-9B
          name: FLUX 图生图
          image_input: true      # 统一模型：文生图 + 图片编辑 + 多参考图
          max_images: 4          # 实测魔搭 image_url 最多 4 张
          sizes: [1024x1024, 832x1216, 1216x832]
      video: []

  - id: gemini
    name: Google Gemini
    kind: gemini
    base_url: https://generativelanguage.googleapis.com/v1beta
    api_key: ${GEMINI_API_KEY}
    models:
      chat:
        - id: gemini-2.5-flash
          name: Gemini 2.5 Flash
          vision: true
        - id: gemini-2.5-pro
          name: Gemini 2.5 Pro
          vision: true
      image:
        - id: imagen-4.0-generate-001
          name: Imagen 4
          sizes: [1024x1024, 1408x768, 768x1408, 1280x896, 896x1280]
        - id: gemini-2.5-flash-image
          name: Gemini Flash Image (Nano Banana)
          image_input: true      # 支持传参考图做编辑
      video:
        - id: veo-3.0-generate-001
          name: Veo 3

  - id: dashscope
    name: 阿里百炼 (通义/万相)
    kind: dashscope
    base_url: https://dashscope.aliyuncs.com/api/v1
    compat_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key: ${DASHSCOPE_API_KEY}
    models:
      chat:
        - id: qwen-plus
          name: 通义千问 Plus
        - id: qwen-vl-max
          name: 通义千问 VL Max
          vision: true
      image:
        - id: wan2.2-t2i-flash
          name: 万相 2.2 文生图 Flash
          sizes: [1024x1024, 1440x810, 810x1440, 1280x960, 960x1280]
        - id: wanx2.1-t2i-turbo
          name: 万相 2.1 文生图 Turbo
          sizes: [1024x1024, 1280x720, 720x1280, 1024x768, 768x1024]
      video:
        - id: wan2.2-t2v-plus
          name: 万相 2.2 文生视频
        - id: wan2.2-i2v-plus
          name: 万相 2.2 图生视频
          image_input: true

  - id: ark
    name: 火山方舟 (豆包/即梦)
    kind: ark
    base_url: https://ark.cn-beijing.volces.com/api/v3
    api_key: ${ARK_API_KEY}
    models:
      chat:
        - id: doubao-seed-1-6-250615
          name: 豆包 Seed 1.6
          vision: true
      image:
        - id: doubao-seedream-4-0-250828
          name: 即梦 Seedream 4.0
          image_input: true      # 支持单图/多图参考（组图）
          sizes: [2K, 4K, 2048x2048, 2304x1728, 1728x2304, 2560x1440, 1440x2560]
      video:
        - id: doubao-seedance-1-0-pro-250528
          name: 即梦 Seedance 1.0 Pro
          image_input: true

  - id: zhipu
    name: 智谱 GLM
    kind: zhipu
    base_url: https://open.bigmodel.cn/api/paas/v4
    api_key: ${ZHIPU_API_KEY}
    models:
      chat:
        - id: glm-4.6
          name: GLM-4.6
        - id: glm-4v-plus
          name: GLM-4V Plus
          vision: true
      image:
        - id: cogview-4
          name: CogView-4
          sizes: [1024x1024, 1344x768, 768x1344, 1440x720, 720x1440]
      video:
        - id: cogvideox-3
          name: CogVideoX-3
          image_input: true

# ==========================================================
# 生成结果保存目录
# 支持相对路径（相对本工程根目录）与绝对路径，如:
#   image_dir: /Users/me/Pictures/AI
#   video_dir: ~/Movies/AI
# 也可以在 Web 界面「⚙️ 模型配置 → 保存目录」里直接浏览选择。
# ==========================================================
storage:
  image_dir: data/media/images
  video_dir: data/media/videos

# ==========================================================
# 对话行为
# inject_datetime: 每次请求在 system prompt 前自动加一段"当前时间"说明，
#   否则模型只知道训练数据里的日期，问"今天几号""最近"就会答错。
# timezone: 留空用服务器系统时区，也可写 Asia/Shanghai、UTC 等。
# extra: 想给所有对话都加的固定说明（比如回答风格），拼在时间说明后面。
# ==========================================================
chat:
  inject_datetime: true
  timezone: Asia/Shanghai
  extra: ""

# ==========================================================
# 腾讯云 COS（临时图床）
# 阿里百炼图生视频、智谱 CogVideoX、魔搭图生图这些接口只认公网图片 URL，
# 不接受 base64。本地上传的参考图会先传到 COS、取预签名 URL 交给服务商，
# 任务结束（成功/失败/超时）立刻删除对象，不会长期占用存储。
# 密钥建议放 .env，用 ${} 引用，不要直接写进本文件提交到 git。
# ==========================================================
cos:
  secret_id: ${COS_SECRET_ID}
  secret_key: ${COS_SECRET_KEY}
  region: ap-guangzhou            # 存储桶所在地域，如 ap-beijing / ap-shanghai
  bucket: ${COS_BUCKET}                      # 形如 my-bucket-1250000000（必须带 APPID）
  prefix: tmp/              # 临时对象的 key 前缀
  expire_seconds: 1800            # 预签名有效期(秒)，要覆盖生成耗时
  scheme: https
  # enabled: false                # 显式关闭；不写则「配全了就自动启用」
  #                               # 关掉后：魔搭自动改用 base64 直传；
  #                               # 百炼图生视频/智谱只认公网 URL，会直接报错

# ==========================================================
# 附件（对话里上传的 PDF / Word / PPT / Excel / 文本文件）
# 服务端本地解析成文本随消息发给模型（各家 chat 接口没有"传文件"这条通道）。
# max_chars:   单个附件最多取多少字，超了截断（塞太多又贵又会冲散模型注意力）
# total_chars: 一次请求所有附件合计上限
# max_mb:      单个文件大小上限
# ==========================================================
attachments:
  max_chars: 60000
  total_chars: 150000
  max_mb: 30

# ==========================================================
# 上游请求重试
# 撞到限流(429)或网关抖动(5xx)时自动退避重试，退避时间翻倍递增；
# 服务端返回 Retry-After 就按它说的等。
#
# 幂等性：429/5xx 说明这次请求肯定没被处理，重试是安全的；而"连不上/读超时"
# 这类不知道对方收没收到的错误，只对 GET(轮询)重试，绝不重发出图/视频提交，
# 免得重复扣一次额度。
#
# 也可以在某个 provider 下写同名的 retry 段单独覆盖。
# ==========================================================
retry:
  attempts: 3                     # 总共尝试几次，1 = 关掉重试
  backoff: 2.0                    # 首次等待秒数，之后翻倍
  max_backoff: 30.0               # 单次等待上限
  statuses: [429, 500, 502, 503, 504]

# ==========================================================
# 日志
# 当天日志写 data/logs/aihub.log，跨天自动改名 aihub-2026-08-12.log。
# retention_days: 历史日志保留天数，启动时和改配置时会清理超期文件。
#                 0 表示永久保留。也可在「🗂 日志管理」页里改。
# ==========================================================
logging:
  retention_days: 7

# 默认选中的模型
defaults:
  chat: "modelscope/deepseek-ai/DeepSeek-V4-Pro"
  image: "modelscope/Qwen/Qwen-Image-2512"
  video: "dashscope/wan2.2-t2v-plus"
